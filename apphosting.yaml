# Firebase App Hosting build/runtime configuration.
#
# Without this file, App Hosting's Cloud Build step has no way to know
# about the six NEXT_PUBLIC_FIREBASE_* values, and Next.js inlines
# NEXT_PUBLIC_* vars into the client bundle at `next build` time (not read
# at runtime) — so a missing var here isn't a runtime gap, it's a build-time
# one, and no Console-only env var setting after the fact can fix an
# already-built bundle. src/lib/firebase/client.ts falls back to inert
# placeholder values ("demo-project", etc.) when these are unset, which is
# needed so local `next build` doesn't crash with auth/invalid-api-key —
# but the same fallback means a build missing these values ships silently
# broken auth instead of failing loudly.
#
# Values below are the real Select Dev (select-dev-508407) Web app config
# from Firebase Console > Project settings > General > Your apps.
# These are public/non-secret client config values — safe to commit as
# plain `value`, not `secret`.
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyBs2apjAHLDld2OhBtJvy21RSBN31tYhaY"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "select-dev-508407.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "select-dev-508407"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "select-dev-508407.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "1062108974890"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:1062108974890:web:f733abeb4d278612559853"
    availability:
      - BUILD
      - RUNTIME

  # Pinned to "false" on purpose: this must never be "true" outside local
  # dev, or the client tries to reach the (nonexistent, in production)
  # 127.0.0.1 emulator ports instead of real Firebase Auth/Firestore.
  - variable: NEXT_PUBLIC_USE_FIREBASE_EMULATOR
    value: "false"
    availability:
      - BUILD
      - RUNTIME

  # Server-only secret used by /api/introduction/generate-presentation to
  # call the Anthropic API. RUNTIME only — never needed at build time,
  # and (unlike the public Firebase config above) never a "value": this
  # must be a Secret Manager reference, not plaintext, so it isn't ever
  # exposed in this file or in a browser bundle. Requires manual setup —
  # see README "AI presentation generation" for the exact commands.
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
    availability:
      - RUNTIME

  # Shared secret gating every /api/admin/matching/* route (the V1
  # matching engine's manual trigger, duplicate-detection, decision, and
  # account-merge endpoints). RUNTIME only, same Secret Manager pattern as
  # ANTHROPIC_API_KEY above — see README "Monthly matching engine" for the
  # exact setup commands. There is no admin-role system in this app yet;
  # this secret is what stands in for one until there is.
  - variable: MATCHING_ADMIN_SECRET
    secret: MATCHING_ADMIN_SECRET
    availability:
      - RUNTIME

  # The ONLY email(s) allowed to sign in to /admin (the Admin Dashboard).
  # A plain value, not a secret — an email address isn't sensitive the way
  # an API key is, and this needs to be easy to read/update without a
  # Secret Manager round-trip. RUNTIME only. See README "Admin Dashboard".
  - variable: ADMIN_ALLOWLIST_EMAILS
    value: "lara.dewavrin@gmail.com"
    availability:
      - RUNTIME
