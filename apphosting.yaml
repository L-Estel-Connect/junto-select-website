# Firebase App Hosting build/runtime configuration.
#
# Without this file, App Hosting's Cloud Build step has no way to know
# about the six NEXT_PUBLIC_FIREBASE_* values, and Next.js inlines
# NEXT_PUBLIC_* vars into the client bundle at `next build` time (not read
# at runtime) — so a missing var here isn't a runtime gap, it's a build-time
# one, and no Console-only env var setting after the fact can fix an
# already-built bundle. src/lib/firebase/client.ts falls back to inert
# placeholder values ("demo-project", etc.) when these are unset, which is
# needed so local `next build` doesn't crash with auth/invalid-api-key —
# but the same fallback means a build missing these values ships silently
# broken auth instead of failing loudly.
#
# Keeps at least one instance warm at all times instead of the default
# scale-to-zero behavior, so the first request after a period of no
# traffic doesn't pay a cold-start penalty (container start + Next.js
# server init) on top of the app's own load time. This introduces a
# small baseline Cloud Run cost (one instance billed continuously)
# instead of paying only for active request time.
runConfig:
  minInstances: 1

# Values below are the real Select Dev (select-dev-508407) Web app config
# from Firebase Console > Project settings > General > Your apps.
# These are public/non-secret client config values — safe to commit as
# plain `value`, not `secret`.
env:
  # Junto Select's own public browser origin — see
  # src/lib/config/appBaseUrl.ts for why every server-side redirect back
  # into this app (Stripe Checkout/Portal return URLs) and every public
  # SEO surface (metadataBase, canonical, Open Graph url, robots.txt's
  # sitemap reference, sitemap.xml) reads this instead of deriving it
  # from the incoming request, which is unreliable behind App Hosting's
  # Cloud Run proxy (the confirmed cause of the "0.0.0.0" Customer Portal
  # bug). BUILD availability is required too: the root layout's metadata
  # and robots.ts/sitemap.ts are statically generated at `next build`
  # time, not per-request. Update this ONE value (only) when the custom
  # domain (juntoselect.com) goes live — no source file should need
  # editing for that move.
  - variable: APP_BASE_URL
    value: "https://junto-select-website--select-dev-508407.europe-west4.hosted.app"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyBs2apjAHLDld2OhBtJvy21RSBN31tYhaY"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "select-dev-508407.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "select-dev-508407"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "select-dev-508407.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "1062108974890"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:1062108974890:web:f733abeb4d278612559853"
    availability:
      - BUILD
      - RUNTIME

  # Pinned to "false" on purpose: this must never be "true" outside local
  # dev, or the client tries to reach the (nonexistent, in production)
  # 127.0.0.1 emulator ports instead of real Firebase Auth/Firestore.
  - variable: NEXT_PUBLIC_USE_FIREBASE_EMULATOR
    value: "false"
    availability:
      - BUILD
      - RUNTIME

  # Server-only secret used by /api/introduction/generate-presentation to
  # call the Anthropic API. RUNTIME only — never needed at build time,
  # and (unlike the public Firebase config above) never a "value": this
  # must be a Secret Manager reference, not plaintext, so it isn't ever
  # exposed in this file or in a browser bundle. Requires manual setup —
  # see README "AI presentation generation" for the exact commands.
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
    availability:
      - RUNTIME

  # Shared secret gating every /api/admin/matching/* route (the V1
  # matching engine's manual trigger, duplicate-detection, decision, and
  # account-merge endpoints). RUNTIME only, same Secret Manager pattern as
  # ANTHROPIC_API_KEY above — see README "Monthly matching engine" for the
  # exact setup commands. There is no admin-role system in this app yet;
  # this secret is what stands in for one until there is.
  - variable: MATCHING_ADMIN_SECRET
    secret: MATCHING_ADMIN_SECRET
    availability:
      - RUNTIME

  # The ONLY email(s) allowed to sign in to /admin (the Admin Dashboard).
  # A plain value, not a secret — an email address isn't sensitive the way
  # an API key is, and this needs to be easy to read/update without a
  # Secret Manager round-trip. RUNTIME only. See README "Admin Dashboard".
  - variable: ADMIN_ALLOWLIST_EMAILS
    value: "lara.dewavrin@gmail.com"
    availability:
      - RUNTIME

  # --- Brevo (public invitation-form contact sync) ---
  # See README "Brevo configuration required". BREVO_LIST_ID is the
  # account owner's EXISTING Brevo list (Contacts -> Lists) — not a
  # secret, so a plain value like ADMIN_ALLOWLIST_EMAILS above. Never
  # create a new list here; this must always point at that same list.
  - variable: BREVO_LIST_ID
    value: "12"
    availability:
      - RUNTIME

  # Server-only Brevo API key. RUNTIME only, Secret Manager — same
  # treatment as STRIPE_SECRET_KEY below. Shared by both the public
  # invitation-form contact sync above and the transactional sender below
  # (same key, two different Brevo API endpoints — see
  # brevoTransactional.ts). If this secret's value/access-grant was never
  # created in Secret Manager for this backend, the commands are:
  #   firebase apphosting:secrets:set BREVO_API_KEY --project select-dev-508407
  #   firebase apphosting:secrets:grantaccess BREVO_API_KEY --project select-dev-508407 --backend <backend-id>
  # This must be verified directly against the live Secret Manager/App
  # Hosting backend, not assumed from this file alone — the declaration
  # below only means the app is wired to read a secret named
  # BREVO_API_KEY, not that a value has been set for it. Until it
  # resolves to a real key, /api/invitation still captures every
  # submission in Firestore (invitationRequests/{id}) and transactional
  # sends fail closed (see sendOutboundEmails.ts) — neither blocks the
  # user-facing request that triggered them.
  - variable: BREVO_API_KEY
    secret: BREVO_API_KEY
    availability:
      - RUNTIME

  # --- Brevo (transactional email sender identity) ---
  # See README "Transactional email delivery". Required by
  # getTransactionalSenderIdentity() (brevoTransactional.ts) before any of
  # the 6 outboundEmails types can send — the `juntoselect.com` sending
  # domain has already been verified/authenticated on the Brevo side, so
  # this only needs the matching plain values, not a DNS/Brevo change.
  # Not secrets — a sender name/address isn't sensitive, same treatment as
  # ADMIN_ALLOWLIST_EMAILS above.
  - variable: BREVO_SENDER_NAME
    value: "Junto Select"
    availability:
      - RUNTIME
  - variable: BREVO_SENDER_EMAIL
    value: "contact@juntoselect.com"
    availability:
      - RUNTIME

  # --- Stripe (Paid Membership V1) ---
  # See README "Stripe membership billing" for the full setup checklist.
  # ALL of this must point at TEST MODE keys/prices until the user has
  # explicitly reviewed and approved going live — nothing in this repo
  # enables Stripe Live Mode by itself.

  # Server-only secret key. RUNTIME only, Secret Manager — never a plain
  # `value`, same treatment as ANTHROPIC_API_KEY above. Starts with
  # `sk_test_` in test mode.
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME

  # Signing secret for the webhook endpoint (`/api/billing/webhook`),
  # obtained when the endpoint is registered in the Stripe Dashboard (or
  # `stripe listen` locally). Server-only, RUNTIME only, Secret Manager.
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - RUNTIME

  # The three sellable plans' Stripe Price IDs — the server-side allowlist
  # `src/lib/stripe/plans.ts` maps a client-supplied plan key to one of
  # these; the client can never supply a Price ID or amount directly. Not
  # secrets (a Price ID alone can't charge anything without the secret key
  # above), so plain `value`s, same treatment as ADMIN_ALLOWLIST_EMAILS.
  # TEST MODE Price IDs, created in the Stripe Dashboard (test mode) —
  # replace with LIVE Price IDs only after explicit sign-off to go live.
  - variable: STRIPE_PRICE_MONTHLY
    value: "price_1UFH9qGlmEAMyuMwsK1ZAJXq"
    availability:
      - RUNTIME
  - variable: STRIPE_PRICE_THREE_MONTH
    value: "price_1UFHCWGlmEAMyuMwupyRVcWp"
    availability:
      - RUNTIME
  - variable: STRIPE_PRICE_SIX_MONTH
    value: "price_1UFHD2GlmEAMyuMwRWxOlFjl"
    availability:
      - RUNTIME
